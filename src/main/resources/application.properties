spring.application.name=huddle

# Chat history kept in memory per room (oldest evicted first)
huddle.history.max-per-room=500

# AI summaries. The key is read from the environment only; never put a real key in this file.
huddle.ai.api-key=${ANTHROPIC_API_KEY:}
huddle.ai.model=claude-opus-5-5

# Extra origins allowed to open the WebSocket (comma-separated). Empty = same-origin only.
huddle.websocket.allowed-origin-patterns=

# Only expose the health endpoint (used by Docker healthcheck / Cloud Run)
management.endpoints.web.exposure.include=health
